# Full system for local development and integration tests, with the local telemetry stack
# (lgtm: Grafana at http://localhost:3000, see docs/observability.md).
# Values come from the repository-root .env file (copy .env.example to .env first).
# The test database is created only when the db volume is new. If the volume already
# exists, run `docker compose down -v` once (this deletes local data) to get it.

services:
  db:
    # PostgreSQL 18, the default major version for new Neon projects.
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?set POSTGRES_TEST_DB in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    configs:
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/10-create-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      AI_PROVIDER: ${AI_PROVIDER:?set AI_PROVIDER in .env}
      # Traces, metrics and logs go to the lgtm service over OTLP/HTTP (issue #74). There is
      # deliberately no depends_on on lgtm: the backend works the same while it is down.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  lgtm:
    # The local telemetry stack (issue #74, docs/observability.md): OpenTelemetry Collector,
    # Prometheus, Tempo, Loki and Grafana in one image, pinned to an exact version.
    # Grafana has no login, so both ports are published on 127.0.0.1 only.
    image: grafana/otel-lgtm:0.39.0
    ports:
      # Grafana: http://localhost:3000
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
      # OTLP/HTTP, for a backend running on the host (OTEL_EXPORTER_OTLP_ENDPOINT in .env).
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-4318}:4318"
    volumes:
      # Traces, metrics, logs and Grafana's data, kept across restarts.
      - lgtm-data:/data

  frontend:
    # The production build of the React app, served by nginx (see frontend/Dockerfile).
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  db-data:
  lgtm-data:

configs:
  # Runs once, on the first start with an empty volume: creates the test database.
  create-test-db:
    content: |
      #!/bin/sh
      set -e
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        -c "CREATE DATABASE \"$$POSTGRES_TEST_DB\" OWNER \"$$POSTGRES_USER\""
