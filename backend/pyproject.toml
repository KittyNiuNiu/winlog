[project]
name = "winlog-backend"
version = "0.1.0"
description = "Winlog backend: the REST API defined in ../openapi.yaml."
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "jsonschema>=4.23",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
