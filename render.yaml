# Render Blueprint for production (issue #38, product-spec.md §10.2 and §10.4).
# Reference: https://render.com/docs/blueprint-spec
# How to set up and redeploy production from scratch: ops/deployment.md.
#
# - The backend is a Docker web service built from backend/Dockerfile. Its start script
#   (backend/start.sh) applies the migrations, resets the demo account and starts the server
#   on the port Render sets in PORT.
# - The frontend is a static site built from frontend/ with npm.
# - The database is PostgreSQL 18 on Neon (AWS eu-central-1, Frankfurt), not managed here.
#
# Secrets: only DATABASE_URL and AI_API_KEY are secret. They are `sync: false`, so Render asks
# for them when the Blueprint is created; they never have a value in this file. Every other
# value is written here, so it is reviewed in git. Change those values here, not in the Render
# Dashboard: a Blueprint sync overwrites dashboard edits of values this file sets.
#
# Deploys: both services deploy from main, and only after all GitHub checks of the commit have
# passed (`autoDeployTrigger: checksPass`, §10.2). #39 replaces this with its own pipeline.

services:
  # --- Backend: FastAPI in Docker ---
  - type: web
    name: winlog-api
    runtime: docker
    # Free instance: sleeps after 15 minutes without requests; the first request after that
    # waits for a cold start (§12). No paid plan without the product owner's approval.
    plan: free
    # Closest Render region to the Neon project (AWS eu-central-1, Frankfurt).
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # GET /health checks the database too (#4).
    healthCheckPath: /health
    envVars:
      # Secrets, entered in the Render Dashboard when the Blueprint is created.
      # Neon's direct (not pooled) connection string, with its sslmode=require part.
      - key: DATABASE_URL
        sync: false
      # The production-only OpenRouter key, with a spending limit.
      - key: AI_API_KEY
        sync: false

      # The static site's public URL (#3): https://<host>, no trailing slash.
      - key: CORS_ALLOWED_ORIGINS
        value: https://winlog-app.onrender.com

      # Real AI through OpenRouter, zero data retention on every request (§8, #13, #14).
      - key: AI_PROVIDER
        value: openai-compatible
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      # docs/decisions/default-model.md (backup: deepseek/deepseek-v4.1-flash).
      - key: AI_MODEL
        value: anthropic/claude-haiku-5.5
      - key: AI_SUGGESTION_TIMEOUT_SECONDS
        value: "15"
      - key: AI_SUMMARY_TIMEOUT_SECONDS
        value: "60"
      - key: AI_SUMMARY_MAX_TOKENS
        value: "16000"
      - key: AI_SUMMARY_MAX_INPUT_CHARACTERS
        value: "50000"

      # Daily AI usage limits (§8, #15).
      - key: AI_DAILY_SUGGESTIONS_PER_USER
        value: "10"
      - key: AI_DAILY_SUMMARIES_PER_USER
        value: "2"
      - key: AI_DAILY_REQUESTS_GLOBAL
        value: "100"

      # Login and demo-login attempt limits (FR-A4, #46).
      - key: LOGIN_MAX_FAILED_ATTEMPTS
        value: "10"
      - key: LOGIN_ATTEMPT_WINDOW_MINUTES
        value: "15"
      - key: DEMO_LOGIN_MAX_ATTEMPTS
        value: "20"
      - key: DEMO_LOGIN_WINDOW_MINUTES
        value: "60"

      # Login token lifetime in days (FR-A2, #7).
      - key: TOKEN_LIFETIME_DAYS
        value: "7"

      # Seconds the health check waits for the database (#4).
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "3"

      # The shared demo account (FR-X1, #21). Not a secret. The start script resets it before
      # the server accepts requests, so nobody can register this address first.
      - key: DEMO_EMAIL
        value: demo@example.com

      # Not set on purpose: OTEL_EXPORTER_OTLP_ENDPOINT (no telemetry export in production;
      # the JSON logs go to Render's log stream, docs/observability.md, #92), PORT (Render sets
      # it), and the variables only Docker Compose or the tests use (POSTGRES_*, *_HOST_PORT,
      # TEST_DATABASE_URL).

  # --- Frontend: the React build as a static site ---
  # Static sites are free and served from Render's global CDN, so they take no plan and no
  # region.
  - type: web
    name: winlog-app
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    # Refuses to build without VITE_API_BASE_URL, like frontend/Dockerfile, so a forgotten
    # value cannot produce a site that calls no backend. Prints the Node version for the log.
    buildCommand: >-
      cd frontend &&
      { test -n "$VITE_API_BASE_URL" || { echo "VITE_API_BASE_URL is required: set it to the backend's URL (see ops/deployment.md)" >&2; exit 1; }; } &&
      echo "Node $(node --version)" &&
      npm ci --no-audit --no-fund &&
      npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # Client-side routes: every path that is not a built file shows the app, so reloading
      # /review, /summaries/<id> or /entries/new works. Built files (/assets/...) are served
      # as files, because Render applies a rewrite only when no file exists at the path.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The backend's public URL, built into the JavaScript (#25): https://<host>, no
      # trailing slash. A change needs a new static-site build.
      - key: VITE_API_BASE_URL
        value: https://winlog-api.onrender.com
      # The Node version pinned in frontend/.nvmrc and package.json "engines". Set explicitly,
      # because the build starts at the repository root, where Render looks for version files.
      - key: NODE_VERSION
        value: 26.13.0
