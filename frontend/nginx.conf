# Serves the production build. Every client-side route falls back to index.html, so
# reloading a page such as /review works.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't reveal the nginx version.
    server_tokens off;

    # Built files have a content hash in their name, so they can be cached for good.
    # A missing file is a real 404, not the app.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is always checked again, so a new deploy shows up on reload.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
