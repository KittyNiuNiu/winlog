# CI: checks every push to any branch (product-spec.md §10.2).
# It needs no repository secrets. The configuration comes from .env.example, copied to .env,
# so CI fails when .env.example misses a variable the app needs (the Backend job starts the
# backend with only that .env), and the AI provider is the mock (AI_PROVIDER=mock in
# .env.example). No job calls a real AI API.
#
# CI only checks: it pushes no image and deploys nothing, on any branch. When a CI run for a push
# to main passes, the Deploy workflow (deploy.yml) publishes the image the Backend image job built
# and deploys it (#39). No job here may have a condition that skips it on main: a skipped job
# does not fail the run, so it could let a deploy through.
#
# Actions used, each pinned to at least a major version:
# - actions/checkout@v7: checks out the repository.
# - actions/setup-node@v7: installs Node from frontend/.nvmrc and caches npm downloads.
# - actions/upload-artifact@v7: uploads the viewport screenshots of the Frontend job (#36),
#   when the Full system job fails, the end-to-end test's trace and screenshot (#37), and on
#   main the checked backend image for the Deploy workflow (#39).
# - astral-sh/setup-uv@v10.3.3: installs uv and caches uv downloads. setup-uv publishes no
#   floating major tag (such as v10), so it is pinned to its exact release.
# Python comes from backend/.python-version: `uv python install` reads that file.

name: CI

on:
  push:
    branches: ["**"]

# A new push to the same branch cancels the run still in progress for that branch. On main, the
# cancelled run's commit is then not deployed; a deploy already running in deploy.yml is not
# affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Lint openapi.yaml
        # Redocly CLI pinned to its major version, so a new major cannot break CI unnoticed.
        # Warnings are reported, errors fail the job.
        run: npx --yes @redocly/cli@2 lint openapi.yaml

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from .env.example
        working-directory: .
        run: cp .env.example .env

      - name: Check that the AI provider is the mock
        working-directory: .
        run: |
          grep -qx 'AI_PROVIDER=mock' .env || { echo "::error::.env.example must set AI_PROVIDER=mock"; exit 1; }
          grep -qx 'AI_API_KEY=' .env || { echo "::error::.env.example must leave AI_API_KEY empty"; exit 1; }

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Same uv version as backend/Dockerfile.
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: Install dependencies
        # --locked also fails when uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Start PostgreSQL
        working-directory: .
        # --wait returns once the db health check passes. The test database is created on start.
        run: docker compose up -d --wait db

      - name: Backend starts with the settings from .env
        # The tests set their own DATABASE_URL, CORS_ALLOWED_ORIGINS and AI_PROVIDER, and in the
        # Full system job Compose sets the backend's variables, so only this step runs the backend
        # with nothing but .env. Alembic and the app load every setting from .env (app/settings.py)
        # and stop when one they require is missing or invalid. Alembic migrates the database
        # DATABASE_URL names, then the app must answer GET /health with 200.
        run: |
          uv run alembic upgrade head
          uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          status=none
          for _ in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/health || true)
            [ "$status" = "200" ] && break
            kill -0 "$backend_pid" 2>/dev/null || break
            sleep 1
          done
          kill "$backend_pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/backend.log"
          [ "$status" = "200" ] || { echo "::error::The backend did not start with the .env from .env.example (GET /health: $status)"; exit 1; }

      - name: Print the database logs
        if: failure()
        working-directory: .
        run: docker compose logs --no-color db

      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: docker compose down -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the viewport tests
        # The browser that matches the pinned @playwright/test version, with its system libraries.
        run: npx playwright install --with-deps chromium

      - name: Generated API types match openapi.yaml
        # Regenerates src/api/schema.d.ts from ../openapi.yaml and fails when the committed
        # file is changed or missing, so the frontend types never drift from the contract.
        run: |
          npm run generate:api
          if [ -n "$(git status --porcelain -- src/api/schema.d.ts)" ]; then
            git diff -- src/api/schema.d.ts
            echo "::error::src/api/schema.d.ts does not match openapi.yaml. Run 'npm run generate:api' in frontend/ and commit the result."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Viewport tests
        # Playwright at 360×640 and 1280×800 against the built frontend served by vite preview,
        # with every API call mocked, so no backend is needed (#36).
        run: npm run test:viewport

      - name: Upload the viewport screenshots
        # On every run, passed or failed, so people can look at every screen.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: viewport-screenshots
          path: frontend/viewport-screenshots/
          if-no-files-found: warn

  image:
    name: Backend image
    # Builds the backend image that is deployed (#39), on every push, and checks it. Nothing is
    # pushed from CI. On main, the checked image is kept as the `backend-image` artifact, and the
    # Deploy workflow (deploy.yml) pushes exactly this image to GHCR once every CI job of the
    # commit has passed. So each main commit's image is built once, here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        # For linux/amd64, the platform Render runs. Without a provenance attestation the image
        # is a single manifest, so its digest is the one deployed. The revision label names the
        # commit, which the Deploy workflow checks before it pushes the image.
        run: >-
          docker buildx build
          --platform linux/amd64
          --provenance=false
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --load
          --tag winlog-backend:ci
          backend

      - name: The image holds no .env file
        # No file named .env or .env.<anything> anywhere in the image's file system (#38 open
        # point 3). .dockerignore keeps them out of the build context and the Dockerfile copies
        # only named paths; this checks the built result. First the check must see the app's
        # files, so an empty result means something.
        run: |
          seen=$(docker run --rm -u 0 --entrypoint find winlog-backend:ci / -xdev -path /app/start.sh)
          [ "$seen" = /app/start.sh ] || { echo "::error::The check cannot see /app/start.sh in the image"; exit 1; }
          found=$(docker run --rm -u 0 --entrypoint find winlog-backend:ci / -xdev -name '.env*')
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::The backend image holds the files above. Check .dockerignore and the COPY lines in backend/Dockerfile."
            exit 1
          fi
          echo "No file named .env* in the image."

      - name: The image is linked to the repository
        # GHCR links the package to the repository through this label.
        run: |
          source=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' winlog-backend:ci)
          [ "$source" = "https://github.com/KittyNiuNiu/winlog" ] || { echo "::error::Label org.opencontainers.image.source is '$source'"; exit 1; }
          echo "org.opencontainers.image.source=$source"

      - name: Save the image for the Deploy workflow
        if: github.ref == 'refs/heads/main'
        run: docker save winlog-backend:ci | gzip > "$RUNNER_TEMP/backend-image.tar.gz"

      - name: Upload the image for the Deploy workflow
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar.gz
          # Already compressed. Kept for a week: the Deploy workflow downloads it minutes later.
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  tests:
    name: Tests
    # All unit and integration tests with the single command from AGENTS.md (#73): backend unit,
    # backend integration (with the PostgreSQL test database) and the frontend Vitest suite.
    # The Backend and Frontend jobs do not run the tests again.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from .env.example
        # The integration tests read TEST_DATABASE_URL from it.
        run: cp .env.example .env

      - name: Check that the AI provider is the mock
        run: |
          grep -qx 'AI_PROVIDER=mock' .env || { echo "::error::.env.example must set AI_PROVIDER=mock"; exit 1; }
          grep -qx 'AI_API_KEY=' .env || { echo "::error::.env.example must leave AI_API_KEY empty"; exit 1; }

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Same uv version as backend/Dockerfile.
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python from .python-version
        working-directory: backend
        run: uv python install

      - name: Install backend dependencies
        # --locked also fails when uv.lock is out of date with pyproject.toml.
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: All unit and integration tests
        # Starts the test database with `docker compose up -d --wait db`, runs every suite, prints
        # a summary and fails when any suite fails.
        run: ./test-all.sh

      - name: Print the database logs
        if: failure()
        run: docker compose logs --no-color db

  full-system:
    name: Full system
    # Starts only after the other checks pass, so a broken build does not spend the time.
    needs: [contract, backend, frontend, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Check that the AI provider is the mock
        run: |
          grep -qx 'AI_PROVIDER=mock' .env || { echo "::error::.env.example must set AI_PROVIDER=mock"; exit 1; }
          grep -qx 'AI_API_KEY=' .env || { echo "::error::.env.example must leave AI_API_KEY empty"; exit 1; }

      - name: Build and start all services
        run: docker compose up --build -d

      - name: Backend health endpoint returns 200
        # The backend runs its migrations before it starts serving, so wait for it.
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -s -o health.json -w '%{http_code}' --max-time 5 http://localhost:8000/health || true)
            if [ "$status" = "200" ]; then
              cat health.json; echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::GET /health did not return 200 (last status: $status)"
          exit 1

      - name: Backend migrations ran on start
        # Exits with an error unless the database is at the latest migration.
        run: docker compose exec -T backend alembic current --check-heads

      - name: Frontend answers with 200
        run: |
          for path in / /review; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:8080$path")
            echo "GET $path -> $status"
            [ "$status" = "200" ] || { echo "::error::GET $path returned $status"; exit 1; }
          done

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for the end-to-end test
        # The browser that matches the pinned @playwright/test version, with its system libraries.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        # The main user flow in Chromium against the running system with the mock AI provider
        # (#37). The base URL is the default, http://localhost:8080 (the frontend container).
        working-directory: frontend
        run: npm run test:e2e

      - name: Telemetry reached the local stack
        # The end-to-end test generated a summary with the mock (#74). Grafana (lgtm service,
        # no login, 127.0.0.1 only) must show its trace in Tempo, a log record with the same
        # trace ID in Loki, and the outcome counter in Prometheus. The backend batches traces
        # and logs (about 5 s) and exports metrics every 10 s, so this retries for up to 90 s.
        # Tempo's search API drops leading zeros from trace IDs, while Loki holds the full
        # 32-character ID, so the ID is padded back to 32 characters before the Loki query.
        # Then lgtm is stopped, and the backend must still answer GET /health with 200. Last, the
        # backend container's log must have no uvicorn access log line.
        run: |
          grafana=http://127.0.0.1:3000/api/datasources/proxy/uid
          tempo_ok=no; loki_ok=no; prometheus_ok=no; trace_id=
          for attempt in $(seq 1 45); do
            if [ -z "$trace_id" ]; then
              trace_id=$(curl -s -G --max-time 5 "$grafana/tempo/api/search" \
                --data-urlencode 'q={resource.service.name="winlog-backend" && name="POST /summaries"}' \
                --data-urlencode 'limit=20' \
                | python3 -c 'import json, sys; traces = json.load(sys.stdin).get("traces") or []; print(traces[0]["traceID"].zfill(32) if traces else "")' || true)
              [ -n "$trace_id" ] && tempo_ok=yes
            fi
            if [ -n "$trace_id" ] && [ "$loki_ok" = no ]; then
              lines=$(curl -s -G --max-time 5 "$grafana/loki/loki/api/v1/query_range" \
                --data-urlencode "query={service_name=\"winlog-backend\"} | trace_id=\"$trace_id\"" \
                --data-urlencode 'since=1h' \
                | python3 -c 'import json, sys; print(sum(len(r["values"]) for r in json.load(sys.stdin)["data"]["result"]))' || echo 0)
              [ "${lines:-0}" -ge 1 ] && loki_ok=yes
            fi
            if [ "$prometheus_ok" = no ]; then
              count=$(curl -s -G --max-time 5 "$grafana/prometheus/api/v1/query" \
                --data-urlencode 'query=sum(winlog_summary_generate_requests_total{winlog_outcome="created"})' \
                | python3 -c 'import json, sys; r = json.load(sys.stdin)["data"]["result"]; print(int(float(r[0]["value"][1])) if r else 0)' || echo 0)
              [ "${count:-0}" -ge 1 ] && prometheus_ok=yes
            fi
            [ "$tempo_ok$loki_ok$prometheus_ok" = yesyesyes ] && break
            sleep 2
          done
          echo "Tempo: POST /summaries trace from winlog-backend: $tempo_ok (trace ID: ${trace_id:-none})"
          echo "Loki: log record with that trace ID: $loki_ok"
          echo "Prometheus: winlog_summary_generate_requests_total{winlog_outcome=\"created\"} >= 1: $prometheus_ok"
          [ "$tempo_ok$loki_ok$prometheus_ok" = yesyesyes ] || { echo "::error::The summary's telemetry did not reach Grafana"; exit 1; }
          docker compose stop lgtm
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8000/health || true)
          echo "GET /health with lgtm stopped -> $status"
          [ "$status" = "200" ] || { echo "::error::GET /health returned $status after lgtm was stopped"; exit 1; }
          # Uvicorn's access log is off in the image too: its `request finished` JSON lines
          # replace it, and no line has a query string or a client address.
          docker compose logs --no-color backend > backend.log
          tail -n 5 backend.log
          if grep -q 'HTTP/1.1"' backend.log; then
            echo "::error::The backend container printed uvicorn access log lines"
            exit 1
          fi
          grep -q '"message": "request finished"' backend.log || { echo "::error::No request finished line in the backend log"; exit 1; }

      - name: Upload the end-to-end test output
        # The trace and the screenshot of a failed test.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: frontend/e2e-results/
          if-no-files-found: warn

      - name: Print the service logs
        # All services, including lgtm.
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop all services
        if: always()
        run: docker compose down -v
