# CI: checks every push to any branch (product-spec.md §10.2).
# It needs no repository secrets. The configuration comes from .env.example, copied to .env,
# so CI fails when .env.example misses a variable the app needs (the Backend job starts the
# backend with only that .env), and the AI provider is the mock (AI_PROVIDER=mock in
# .env.example). No job calls a real AI API.
#
# Actions used, each pinned to at least a major version:
# - actions/checkout@v7: checks out the repository.
# - actions/setup-node@v7: installs Node from frontend/.nvmrc and caches npm downloads.
# - actions/upload-artifact@v7: uploads the viewport screenshots of the Frontend job (#36) and,
#   when the Full system job fails, the end-to-end test's trace and screenshot (#37).
# - astral-sh/setup-uv@v10.3.3: installs uv and caches uv downloads. setup-uv publishes no
#   floating major tag (such as v10), so it is pinned to its exact release.
# Python comes from backend/.python-version: `uv python install` reads that file.

name: CI

on:
  push:
    branches: ["**"]

# A new push to the same branch cancels the run still in progress for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Lint openapi.yaml
        # Redocly CLI pinned to its major version, so a new major cannot break CI unnoticed.
        # Warnings are reported, errors fail the job.
        run: npx --yes @redocly/cli@2 lint openapi.yaml

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from .env.example
        working-directory: .
        run: cp .env.example .env

      - name: Check that the AI provider is the mock
        working-directory: .
        run: |
          grep -qx 'AI_PROVIDER=mock' .env || { echo "::error::.env.example must set AI_PROVIDER=mock"; exit 1; }
          grep -qx 'AI_API_KEY=' .env || { echo "::error::.env.example must leave AI_API_KEY empty"; exit 1; }

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Same uv version as backend/Dockerfile.
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: Install dependencies
        # --locked also fails when uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Start PostgreSQL
        working-directory: .
        # --wait returns once the db health check passes. The test database is created on start.
        run: docker compose up -d --wait db

      - name: Backend starts with the settings from .env
        # The tests set their own DATABASE_URL, CORS_ALLOWED_ORIGINS and AI_PROVIDER, and in the
        # Full system job Compose sets the backend's variables, so only this step runs the backend
        # with nothing but .env. Alembic and the app load every setting from .env (app/settings.py)
        # and stop when one they require is missing or invalid. Alembic migrates the database
        # DATABASE_URL names, then the app must answer GET /health with 200.
        run: |
          uv run alembic upgrade head
          uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          status=none
          for _ in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/health || true)
            [ "$status" = "200" ] && break
            kill -0 "$backend_pid" 2>/dev/null || break
            sleep 1
          done
          kill "$backend_pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/backend.log"
          [ "$status" = "200" ] || { echo "::error::The backend did not start with the .env from .env.example (GET /health: $status)"; exit 1; }

      - name: Integration tests
        # TEST_DATABASE_URL comes from .env (copied from .env.example).
        run: uv run pytest tests/integration

      - name: Print the database logs
        if: failure()
        working-directory: .
        run: docker compose logs --no-color db

      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: docker compose down -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the viewport tests
        # The browser that matches the pinned @playwright/test version, with its system libraries.
        run: npx playwright install --with-deps chromium

      - name: Generated API types match openapi.yaml
        # Regenerates src/api/schema.d.ts from ../openapi.yaml and fails when the committed
        # file is changed or missing, so the frontend types never drift from the contract.
        run: |
          npm run generate:api
          if [ -n "$(git status --porcelain -- src/api/schema.d.ts)" ]; then
            git diff -- src/api/schema.d.ts
            echo "::error::src/api/schema.d.ts does not match openapi.yaml. Run 'npm run generate:api' in frontend/ and commit the result."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Viewport tests
        # Playwright at 360×640 and 1280×800 against the built frontend served by vite preview,
        # with every API call mocked, so no backend is needed (#36).
        run: npm run test:viewport

      - name: Upload the viewport screenshots
        # On every run, passed or failed, so people can look at every screen.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: viewport-screenshots
          path: frontend/viewport-screenshots/
          if-no-files-found: warn

  full-system:
    name: Full system
    # Starts only after the other checks pass, so a broken build does not spend the time.
    needs: [contract, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Check that the AI provider is the mock
        run: |
          grep -qx 'AI_PROVIDER=mock' .env || { echo "::error::.env.example must set AI_PROVIDER=mock"; exit 1; }
          grep -qx 'AI_API_KEY=' .env || { echo "::error::.env.example must leave AI_API_KEY empty"; exit 1; }

      - name: Build and start all services
        run: docker compose up --build -d

      - name: Backend health endpoint returns 200
        # The backend runs its migrations before it starts serving, so wait for it.
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -s -o health.json -w '%{http_code}' --max-time 5 http://localhost:8000/health || true)
            if [ "$status" = "200" ]; then
              cat health.json; echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::GET /health did not return 200 (last status: $status)"
          exit 1

      - name: Backend migrations ran on start
        # Exits with an error unless the database is at the latest migration.
        run: docker compose exec -T backend alembic current --check-heads

      - name: Frontend answers with 200
        run: |
          for path in / /review; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:8080$path")
            echo "GET $path -> $status"
            [ "$status" = "200" ] || { echo "::error::GET $path returned $status"; exit 1; }
          done

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for the end-to-end test
        # The browser that matches the pinned @playwright/test version, with its system libraries.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        # The main user flow in Chromium against the running system with the mock AI provider
        # (#37). The base URL is the default, http://localhost:8080 (the frontend container).
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload the end-to-end test output
        # The trace and the screenshot of a failed test.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: frontend/e2e-results/
          if-no-files-found: warn

      - name: Print the service logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop all services
        if: always()
        run: docker compose down -v
