# Deploy: publishes the backend image and deploys it to dev, then to production after the
# product owner's approval (issue #39, product-spec.md §10.2 and §10.4). How to use it, approve,
# roll back and set it up: ops/deployment.md.
#
# When it runs:
# - After a CI run for a push to main has finished. Only a CI run that passed (every job
#   succeeded) is published and deployed. A failed or cancelled CI run deploys nothing.
# - On a push to any other branch, so GitHub checks this file there too. Then every job is
#   skipped: nothing is pushed and nothing is deployed from a branch.
#
# The jobs:
# 1. Publish image: pushes the image that CI built and checked for this commit (the
#    `backend-image` artifact of the CI run) to ghcr.io/kittyniuniu/winlog-backend, tagged
#    sha-<commit SHA>. Nothing is built here, and nothing is built on Render.
# 2. Deploy to dev (GitHub environment `dev`): deploys that image by digest to winlog-api-dev,
#    moves the :dev tag to it, deploys the static site winlog-app-dev from the same commit, and
#    waits until both answer with that commit (#102): the backend's GET /health and the static
#    site's /version.json name the commit they were built from. Render keeps the previous deploy
#    live while the new one starts, so a 200 alone would not show that the new deploy is live.
#    If they do not name the commit within WAIT_TIMEOUT_SECONDS (15 minutes), the job fails, and
#    the production step of the run is not offered.
# 3. Deploy to production (GitHub environment `production`): waits for the product owner's
#    approval, then does the same with the same digest and commit for winlog-api, the
#    :production tag and winlog-app, and waits the same way. It builds nothing.
#
# Secrets: each of the two environments holds two Render deploy hook URLs,
# RENDER_API_DEPLOY_HOOK (the backend) and RENDER_APP_DEPLOY_HOOK (the static site). Environment
# secrets are readable only by a job that uses the environment, and in production only after the
# approval. No step prints a hook URL: curl reads it from its standard input, never from its
# command line, and the log shows only the HTTP status. GHCR uses the workflow's GITHUB_TOKEN,
# with packages: write only in the jobs that push or tag the image.
#
# No AI calls: the jobs call only Render's deploy hooks, GHCR, the backend's GET /health and the
# static site's / and /version.json.
#
# Actions used, pinned to a major version:
# - actions/download-artifact@v8: downloads the image artifact from the CI run that triggered
#   this run (needs actions: read and the run's ID).
# docker, curl and python3 are preinstalled on the runner.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    branches-ignore: [main]

# No workflow-level concurrency: a newer push to main never cancels this run. Each deploy job has
# its own group instead, so only one deploy per environment runs at a time.
permissions: {}

env:
  IMAGE: ghcr.io/kittyniuniu/winlog-backend

jobs:
  publish:
    name: Publish image
    # Only for a CI run of a push to main in this repository that passed.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Download the image artifact of the CI run.
      actions: read
      # Push the image to GHCR.
      packages: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      # The commit CI checked. github.sha is the latest commit on main, which can be newer.
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download the image CI built and checked
        uses: actions/download-artifact@v8
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Load the image
        # The image's revision label must be this commit, so a wrong artifact is never pushed.
        run: |
          gunzip -c "$RUNNER_TEMP/backend-image/backend-image.tar.gz" | docker load
          revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' winlog-backend:ci)
          if [ "$revision" != "$SHA" ]; then
            echo "::error::The image artifact is for commit '$revision', not for $SHA"
            exit 1
          fi
          docker tag winlog-backend:ci "$IMAGE:sha-$SHA"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the image
        id: push
        run: |
          docker push "$IMAGE:sha-$SHA"
          # The digest the registry stores for the tag, read back from GHCR.
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --format '{{json .Manifest}}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')
          case "$digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::Could not read the image digest from GHCR (got '$digest')"; exit 1 ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend image published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Image | \`$IMAGE:sha-$SHA\` |"
            echo "| Digest | \`$digest\` |"
            echo
            echo "Dev and production deploy this digest: \`$IMAGE@$digest\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed $IMAGE:sha-$SHA with digest $digest"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  deploy-dev:
    name: Deploy to dev
    needs: publish
    runs-on: ubuntu-latest
    # Room for the hooks and the whole wait (WAIT_TIMEOUT_SECONDS) after them.
    timeout-minutes: 25
    environment:
      name: dev
      url: https://winlog-app-dev.onrender.com
    # One dev deploy at a time. A newer run waits and never cancels a running deploy.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      # Move the :dev tag in GHCR.
      packages: write
    env:
      ENVIRONMENT: dev
      TAG: dev
      API_SERVICE: winlog-api-dev
      APP_SERVICE: winlog-app-dev
      # The services' public URLs, as in render.yaml (ops/deployment.md).
      API_URL: https://winlog-api-dev.onrender.com
      APP_URL: https://winlog-app-dev.onrender.com
      SHA: ${{ needs.publish.outputs.sha }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      # The wait for the new deploys (#102) gives up after WAIT_TIMEOUT_SECONDS and polls every
      # WAIT_INTERVAL_SECONDS. The same values in both deploy jobs.
      WAIT_TIMEOUT_SECONDS: 900
      WAIT_INTERVAL_SECONDS: 10
    # The production job runs the same steps (the alias *deploy-steps), with its own env.
    steps: &deploy-steps
      - name: Check the deploy hook secrets
        # Fails before any deploy when a secret is missing, and names it. Never prints a value.
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          RENDER_APP_DEPLOY_HOOK: ${{ secrets.RENDER_APP_DEPLOY_HOOK }}
        run: |
          missing=no
          for name in RENDER_API_DEPLOY_HOOK RENDER_APP_DEPLOY_HOOK; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set in the GitHub environment '$ENVIRONMENT' (see ops/deployment.md)"
              missing=yes
            fi
          done
          [ "$missing" = no ]
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::No image digest from the Publish image job"; exit 1 ;;
          esac
          echo "Deploying commit $SHA and image $IMAGE@$DIGEST to $ENVIRONMENT."

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Deploy the backend image and the static site
        # 1. The backend's deploy hook with imgURL=<image>@<digest>: Render deploys exactly that
        #    image, not whatever a tag points to.
        # 2. The environment's tag (:dev or :production) moves to that digest, so a Render deploy
        #    that names no image (a Blueprint sync, a changed variable, a manual deploy) deploys
        #    the image last deployed here, never a newer one.
        # 3. The static site's deploy hook with ref=<commit SHA>: Render builds the same commit.
        # A hook URL is passed to curl on its standard input (`--config -`), so it is never on a
        # command line or in the log. Only the HTTP status and Render's deploy ID are printed.
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          RENDER_APP_DEPLOY_HOOK: ${{ secrets.RENDER_APP_DEPLOY_HOOK }}
        run: |
          # call_hook <variable holding the hook URL> <query parameter> <service name>
          call_hook() {
            local url="${!1}" separator='?' status
            case "$url" in *\?*) separator='&' ;; esac
            status=$(printf 'url = "%s%s%s"\n' "$url" "$separator" "$2" \
              | curl --config - --request POST --silent --max-time 60 \
                  --output "$RUNNER_TEMP/hook-response.json" --write-out '%{http_code}') || true
            case "$status" in
              2??)
                deploy_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("deploy", {}).get("id", ""))' \
                  "$RUNNER_TEMP/hook-response.json" 2>/dev/null || true)
                rm -f "$RUNNER_TEMP/hook-response.json"
                echo "Render accepted the deploy of $3 (HTTP $status${deploy_id:+, deploy $deploy_id})."
                ;;
              *)
                rm -f "$RUNNER_TEMP/hook-response.json"
                if [ "${status:-000}" = 000 ]; then result="no answer"; else result="HTTP $status"; fi
                echo "::error::The deploy hook of $3 ($1) failed with $result; Render must answer 2xx. Nothing more is deployed. See ops/deployment.md."
                exit 1
                ;;
            esac
          }

          image_url=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE@$DIGEST")
          call_hook RENDER_API_DEPLOY_HOOK "imgURL=$image_url" "$API_SERVICE"

          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$TAG points to $tagged, not to $DIGEST"
            exit 1
          fi
          echo "Moved $IMAGE:$TAG to $DIGEST."

          call_hook RENDER_APP_DEPLOY_HOOK "ref=$SHA" "$APP_SERVICE"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

      - name: Wait until the backend and the static site answer
        # Passes only when both services answer with the run's commit (#102):
        # - GET $API_URL/health answers 200 with "commit": "$SHA";
        # - GET $APP_URL/ answers 200, and GET $APP_URL/version.json answers 200 with
        #   "commit": "$SHA".
        # Render keeps the previous deploy live until the new one is healthy, and the previous
        # deploy answers 200 too, so only the commit tells the new deploy from the previous one.
        # Any other answer means "not live yet": no answer, a status other than 200, a body that
        # is not JSON (a static site without version.json answers with index.html), or JSON
        # without "commit", with null or with another commit. Each service is checked until it
        # matches, and then no longer. It polls every WAIT_INTERVAL_SECONDS and gives up after
        # WAIT_TIMEOUT_SECONDS with one error that names, for each service that did not match,
        # its URLs, its last answer and the commit expected. The log gets one line each time what
        # a service answers changes, with the seconds since the wait started. /version.json is
        # requested with a query string that differs on each request, so no copy in Render's CDN
        # can answer for the new build. Only the services' public URLs are called, never a hook,
        # and a commit from a body reaches the log only when it is a valid commit.
        run: |
          body="$RUNNER_TEMP/wait-body"

          # Prints what the JSON body in the file $1 names as "commit": the commit when it is a
          # valid commit (exactly 40 lowercase hexadecimal characters), "none" when the body has
          # no "commit" or null, "invalid" for any other value, and "not-json" when the body is
          # not JSON.
          read_commit='
          import json, re, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as file:
                  data = json.load(file)
          except Exception:
              print("not-json")
          else:
              commit = data.get("commit") if isinstance(data, dict) else None
              if commit is None:
                  print("none")
              elif isinstance(commit, str) and re.fullmatch("[0-9a-f]{40}", commit):
                  print(commit)
              else:
                  print("invalid")
          '

          # fetch <url>: sets status (000 for no answer) and commit (see read_commit; "none"
          # unless the status is 200).
          fetch() {
            rm -f "$body"
            status=$(curl --silent --max-time 30 --output "$body" --write-out '%{http_code}' "$1" || true)
            status=${status:-000}
            commit=none
            if [ "$status" = 200 ]; then
              commit=$(python3 -c "$read_commit" "$body" 2>/dev/null) || commit=not-json
            fi
            rm -f "$body"
          }

          # answer <status> <commit>: one answer, as the log and the error show it.
          answer() {
            case "$1:$2" in
              000:*) echo "no answer, no commit" ;;
              200:none) echo "HTTP 200, no commit" ;;
              200:not-json) echo "HTTP 200, no commit (the body is not JSON)" ;;
              200:invalid) echo "HTTP 200, no valid commit" ;;
              200:*) echo "HTTP 200, commit $2" ;;
              *) echo "HTTP $1, no commit" ;;
            esac
          }

          started=$SECONDS
          deadline=$((SECONDS + WAIT_TIMEOUT_SECONDS))
          api_ok=no app_ok=no api_seen= app_seen=
          while :; do
            if [ "$api_ok" = no ]; then
              fetch "$API_URL/health"
              if [ "$status" = 200 ] && [ "$commit" = "$SHA" ]; then api_ok=yes; fi
              api_answer="GET $API_URL/health -> $(answer "$status" "$commit")"
              if [ "$api_answer" != "$api_seen" ]; then
                echo "[+$((SECONDS - started)) s] $API_SERVICE: $api_answer"
                api_seen=$api_answer
              fi
            fi
            if [ "$app_ok" = no ]; then
              index=$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$APP_URL/" || true)
              index=${index:-000}
              # A query string that differs on each request, also from earlier runs' requests.
              fetch "$APP_URL/version.json?wait=$(date +%s%N)"
              if [ "$index" = 200 ] && [ "$status" = 200 ] && [ "$commit" = "$SHA" ]; then app_ok=yes; fi
              if [ "$index" = 000 ]; then index_answer="no answer"; else index_answer="HTTP $index"; fi
              app_answer="GET $APP_URL/ -> $index_answer; GET $APP_URL/version.json -> $(answer "$status" "$commit")"
              if [ "$app_answer" != "$app_seen" ]; then
                echo "[+$((SECONDS - started)) s] $APP_SERVICE: $app_answer"
                app_seen=$app_answer
              fi
            fi
            if [ "$api_ok$app_ok" = yesyes ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              if [ $((WAIT_TIMEOUT_SECONDS % 60)) = 0 ]; then
                limit="$((WAIT_TIMEOUT_SECONDS / 60)) minutes"
              else
                limit="$WAIT_TIMEOUT_SECONDS seconds"
              fi
              error="After $limit, not every service answers with commit $SHA."
              if [ "$api_ok" = no ]; then error="$error $API_SERVICE: $api_seen; expected commit $SHA."; fi
              if [ "$app_ok" = no ]; then error="$error $APP_SERVICE: $app_seen; expected commit $SHA."; fi
              echo "::error::$error See ops/deployment.md, When the wait fails."
              exit 1
            fi
            sleep "$WAIT_INTERVAL_SECONDS"
          done
          echo "After $((SECONDS - started)) s, both services answer with commit $SHA: GET $API_URL/health and GET $APP_URL/version.json (and GET $APP_URL/ answers 200)."

      - name: Summary
        run: |
          {
            echo "### Deployed to $ENVIRONMENT"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Backend image | \`$IMAGE@$DIGEST\` (now also \`:$TAG\`) on \`$API_SERVICE\` |"
            echo "| Static site | \`$APP_SERVICE\`, built from commit \`$SHA\` |"
            echo
            echo "The backend and the static site answered with this commit: \`$API_URL/health\` and"
            echo "\`$APP_URL/version.json\` named \`$SHA\`. The wait sees only the commit; Render's Events"
            echo "also show the digest."
            if [ "$ENVIRONMENT" = dev ]; then
              echo
              echo "**The production step of this run deploys exactly this commit and this digest.**"
              echo "Before approving it, check that the Events of \`$API_SERVICE\` and \`$APP_SERVICE\` in the"
              echo "Render Dashboard show the deploy of \`$DIGEST\` and of commit \`$SHA\` as live, and that"
              echo "$APP_URL works (ops/deployment.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy to production
    # Only after this run's dev deploy succeeded, with the digest and commit it deployed.
    needs: [publish, deploy-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Waits for the product owner's approval (the environment's required reviewer).
    environment:
      name: production
      url: https://winlog-app.onrender.com
    # One production deploy at a time. A newer run waits and never cancels a running deploy. A
    # production step that waits for approval holds this group too, so approve only the newest
    # run's production step and reject older ones that still wait (ops/deployment.md).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      # Move the :production tag in GHCR.
      packages: write
    env:
      ENVIRONMENT: production
      TAG: production
      API_SERVICE: winlog-api
      APP_SERVICE: winlog-app
      API_URL: https://winlog-api.onrender.com
      APP_URL: https://winlog-app.onrender.com
      SHA: ${{ needs.publish.outputs.sha }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      # The same as in the dev job.
      WAIT_TIMEOUT_SECONDS: 900
      WAIT_INTERVAL_SECONDS: 10
    steps: *deploy-steps
